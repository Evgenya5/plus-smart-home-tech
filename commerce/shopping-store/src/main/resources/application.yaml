spring:
  application:
    name: shopping-store

  datasource:
    url: jdbc:postgresql://localhost:5433/commerce_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server
  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/
    eureka:
      instance:
        hostname: localhost
        prefer-ip-address: false