spring:
  application:
    name: warehouse

  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  datasource:
    url: jdbc:postgresql://localhost:5433/commerce_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5

logging:
  level:
    ru.yandex.practicum: DEBUG